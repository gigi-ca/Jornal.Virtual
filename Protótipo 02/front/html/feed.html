<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feed Social</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="/css/global/global.css">
    <link rel="stylesheet" href="/css/global/root.css">
    <link rel="stylesheet" href="/css/feed.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.0.6/wordcloud2.min.js"></script>
</head>

<body>

    <header class="header-global">
        <div class="logo">
            <i class="fa-solid fa-newspaper"></i>
            <h2>Jornal<span>Online</span></h2>
        </div>

        <nav class="nav-principal">
            <a href="/html/inicio.html">Início</a>
            <a href="/html/feed.html" class="ativo">Feed</a>
            <a href="/html/perfil.html">Minha Conta</a>
            <a href="/html/configuracoes.html">Configurações</a>
        </nav>
    </header>

    <main class="feed-page">

    <div class="container">

        <aside class="esquerda">

            <div class="card card-publicacao">

                <h2>Nova publicação</h2>

                <textarea
                    id="texto"
                    placeholder="O que está acontecendo? Use hashtags..."
                ></textarea>

                <div class="anexo-area">

                    <label for="anexo" class="btn-anexo">
                        <i class="fa-solid fa-paperclip"></i>
                        Adicionar anexo
                    </label>

                    <input
                        type="file"
                        id="anexo"
                        accept="image/*,video/*,.pdf,.doc,.docx"
                    >

                    <div id="preview-anexo"></div>

                </div>

                <button
                    type="button"
                    id="publicar"
                >
                    Publicar
                </button>

            </div>


            <div class="card card-hashtags">

                <div class="titulo-card">

                    <h2>Hashtags em alta</h2>

                    <button
                        type="button"
                        id="btnVerTudo"
                        class="btn-ver-tudo"
                    >
                        Ver tudo
                    </button>

                </div>

                <div class="nuvem-container">
                    <canvas
                        id="nuvem"
                        width="500"
                        height="350"
                    ></canvas>
                </div>

            </div>

        </aside>


        <section class="feed">

            <div class="feed-topo">

                <div>
                    <h1>Feed</h1>

                    <p>
                        Acompanhe as publicações da comunidade.
                    </p>
                </div>

            </div>


            <div class="pesquisa-container">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="pesquisaPublicacoes"
                    placeholder="Pesquisar publicações, usuários ou hashtags..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="btnFiltros"
                    class="btn-filtros"
                    title="Filtros"
                >
                    <i class="fa-solid fa-sliders"></i>
                </button>

            </div>


            <div
                id="filtrosPesquisa"
                class="filtros-pesquisa"
            >

                <button
                    type="button"
                    class="filtro-ativo"
                    data-filtro="recentes"
                >
                    Mais recentes
                </button>

                <button
                    type="button"
                    data-filtro="curtidas"
                >
                    Mais curtidas
                </button>

                <button
                    type="button"
                    data-filtro="comentarios"
                >
                    Mais comentadas
                </button>

            </div>


            <div id="listaPublicacoes">

                <div class="estado-feed">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <span>Carregando publicações...</span>
                </div>

            </div>

        </section>

    </div>

</main>


<div
    id="modalHashtags"
    class="modal"
>

    <div class="modal-content modal-hashtags-content">

        <button
            type="button"
            id="fecharModalHashtags"
            class="close-modal"
            aria-label="Fechar"
        >
            ×
        </button>

        <h2>Hashtags em alta</h2>

        <p class="modal-descricao">
            Confira as hashtags mais utilizadas nas publicações.
        </p>

        <ul id="listaHashtags"></ul>

    </div>

</div>


<div
    id="modalDenuncia"
    class="modal"
>

    <div class="modal-content modal-denuncia-content">

        <button
            type="button"
            id="fecharModalDenuncia"
            class="close-modal"
            aria-label="Fechar"
        >
            ×
        </button>

        <h2>Denunciar conteúdo</h2>

        <p class="modal-descricao">
            Informe o motivo da denúncia.
        </p>

        <input
            type="hidden"
            id="tipoDenuncia"
        >

        <input
            type="hidden"
            id="idDenuncia"
        >

        <textarea
            id="motivoDenuncia"
            placeholder="Digite o motivo da denúncia..."
        ></textarea>

        <div class="modal-acoes">

            <button
                type="button"
                id="cancelarDenuncia"
                class="btn-cancelar"
            >
                Cancelar
            </button>

            <button
                type="button"
                id="confirmarDenuncia"
                class="btn-confirmar"
            >
                Denunciar
            </button>

        </div>

    </div>

</div>

<script src="/js/global/tema.js"></script>
<script src="/js/feed.js"></script>
</html>
