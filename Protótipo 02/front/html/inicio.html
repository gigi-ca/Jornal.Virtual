<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornal Online</title>
    <link rel="stylesheet" href="/css/global/global.css">
    <link rel="stylesheet" href="/css/global/root.css">
    <link rel="stylesheet" href="/css/inicio.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="header-global">
        <div class="logo">
            <i class="fa-solid fa-newspaper"></i>
            <h2>Jornal<span>Online</span></h2>
        </div>

        <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false"
            aria-controls="navPrincipal">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="nav-principal" id="navPrincipal">
            <a href="/html/inicio.html" class="ativo">Início</a>
            <a href="/html/feed.html">Feed</a>
            <a href="/html/perfil.html">Minha Conta</a>
            <a href="/html/configuracoes.html">Configurações</a>
        </nav>
    </header>


    <main>
        <section class="banner">
            <button class="arrow left" aria-label="Anterior" type="button">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="banner-info">
                <span class="tag">DESTAQUE</span>
                <h1>Carregando notícias...</h1>
                <p>Aguarde enquanto buscamos as últimas notícias.</p>
                <button class="btn-banner" type="button">Ler mais</button>
            </div>
            <button class="arrow right" aria-label="Próximo" type="button">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </section>

        <section class="search">
            <div class="input-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" placeholder="Pesquisar notícias..." aria-label="Pesquisar notícias">
            </div>
        </section>

        <section class="cards" aria-label="Notícias recentes">
            <div class="estado-noticias">Carregando notícias...</div>
        </section>
    </main>

    <a href="/html/criar.html" class="floating" id="criarNoticia" hidden>
        <i class="fa-solid fa-plus"></i>
        Criar Notícia
    </a>

    <div class="modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="tituloModal">
            <button class="close" aria-label="Fechar" type="button">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img class="imagem-modal" src="" alt="Imagem da notícia" hidden>
            <div class="modal-body">
                <span class="categoria">NOTÍCIA</span>
                <h2 id="tituloModal"></h2>
                <p class="subtitulo-modal" hidden></p>
                <p class="autor">
                    <i class="fa-solid fa-user"></i>
                </p>
                <hr>
                <p class="texto-noticia"></p>
            </div>
        </div>
    </div>

    <script src="/js/global/tema.js"></script>
    <script src="/js/inicio.js"></script>
</body>

</html>
